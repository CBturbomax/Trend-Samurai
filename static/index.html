:root{--bg:#0f1419;--panel:#151b22;--panel-2:#1b232b;--line:#2a3540;--text:#ffffff;
  --yellow:#ffcb05;--blue:#5b9bd5;--orange:#ed7d31;--up:#ff5a5a;--down:#5b9bd5;
  --fs-h1:48px;--fs-h2:32px;--fs-kpi:54px;--fs-body:20px;--fs-cell:20px;--fs-head:19px;--fs-note:17px;
  --card:var(--panel);--box:var(--panel-2);--y:var(--yellow);--b:var(--blue);--o:var(--orange);--t:var(--text)}
html{font-family:"42dot Sans","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
*,*::before,*::after{font-family:inherit;box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{font-size:var(--fs-body);line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,p,figure{margin:0}
button,input{font-size:inherit;color:inherit;background:none;border:none}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
.dash{max-width:1220px;margin:0 auto;padding:44px 32px 96px;display:flex;flex-direction:column;gap:44px}
#result{display:flex;flex-direction:column;gap:44px} #result:empty,#progress:empty,#kpis:empty{display:none}
.dash-head{display:flex;align-items:center;gap:22px;padding-bottom:28px;border-bottom:2px solid var(--line)}
.brand-mark{width:68px;height:68px;flex:none;object-fit:contain}
.dash-head h1{font-size:var(--fs-h1);font-weight:800;letter-spacing:0;line-height:1.1}
.brand-accent{color:#ffa826}
.brand-by{font-size:.42em;font-weight:500;color:#8b97a3;margin-left:.2em;white-space:nowrap}
.dash-sub{margin-top:8px;font-size:var(--fs-body);opacity:.72}
.kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--line);padding:22px 24px 20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi-label{font-size:var(--fs-note);opacity:.66;letter-spacing:.04em}
.kpi-num{font-size:var(--fs-kpi);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi.is-total{border-top-color:var(--text)}
.kpi.is-done{border-top-color:var(--yellow)} .kpi.is-done .kpi-num{color:var(--yellow)}
.kpi.is-todo{border-top-color:var(--orange)} .kpi.is-todo .kpi-num{color:var(--orange)}
.kpi.is-blue{border-top-color:var(--blue)}
.kgroups{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.kgroup{background:var(--panel);border:1px solid var(--line);padding:10px 12px}
.kg-title{font-weight:800;font-size:var(--fs-note);color:var(--yellow);margin-bottom:8px}
.kg-items{display:flex;flex-wrap:wrap;gap:6px}
.kchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);padding:4px 10px 4px 8px}
.kchip.on{background:var(--yellow);border-color:var(--yellow)} .kchip.on .kwbtn{color:#10161c}
.kchip .kwbtn{font-weight:700;font-size:var(--fs-note);cursor:pointer;padding:0}
.kchip input{margin:0;cursor:pointer}
.gsel{background:var(--panel);border:1px solid var(--line);color:var(--text);font:inherit;font-size:var(--fs-note);padding:4px 8px}
.manage{border:1px solid var(--line);background:var(--panel);padding:14px 18px}
.manage summary{cursor:pointer;font-weight:700;opacity:.8}
.kpi.is-red{border-top-color:var(--up)}
.data-table tr.sec td{background:var(--panel-2);color:var(--yellow);font-weight:800;text-align:left;letter-spacing:.04em}
.progress{display:flex;flex-direction:column;gap:12px}
.progress-bar{display:flex;width:100%;height:34px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.progress-seg{display:flex;align-items:center;justify-content:center;font-size:var(--fs-note);font-weight:700;white-space:nowrap;overflow:hidden}
.progress-seg.done{background:var(--yellow);color:#10161c} .progress-seg.todo{background:var(--orange);color:#10161c}
.progress-legend{display:flex;flex-wrap:wrap;gap:26px;font-size:var(--fs-note);opacity:.8}
.progress-legend span{display:inline-flex;align-items:center;gap:9px}
.swatch{width:15px;height:15px;flex:none} .swatch.done{background:var(--yellow)} .swatch.todo{background:var(--orange)}
.filters,.row{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.toggle-group{display:flex;flex-wrap:wrap;border:1px solid var(--line)}
.toggle{padding:12px 22px;font-size:var(--fs-body);font-weight:700;cursor:pointer;background:var(--panel);border-right:1px solid var(--line)}
.toggle:last-child{border-right:none}
.toggle.on,.toggle[aria-pressed="true"]{background:var(--yellow);color:#10161c}
.btn{padding:12px 22px;font-weight:700;cursor:pointer;background:var(--panel);border:1px solid var(--line)}
.btn:hover{border-color:var(--yellow);color:var(--yellow)}
.btn.main{background:var(--yellow);color:#10161c;border-color:var(--yellow)} .btn.main:hover{color:#10161c}
.search-box{flex:1 1 320px;min-width:260px;display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);padding:11px 18px}
.search-box input,input.wide{width:100%;font-size:var(--fs-body);outline:none}

input::placeholder{color:var(--text);opacity:.45}
.panel{display:flex;flex-direction:column;gap:18px}
.panel-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:16px}
.panel-head h2{font-size:var(--fs-h2);font-weight:800;letter-spacing:.02em}
.panel-head .count,.desc{font-size:var(--fs-note);opacity:.7}
.desc b{opacity:1}
.box{background:var(--panel);border:1px solid var(--line);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
label.ck,.chip{display:inline-flex;gap:9px;align-items:center;background:var(--panel-2);border:1px solid var(--line);padding:8px 14px;font-weight:700}
.dim{opacity:.66;font-weight:400} .warn{color:var(--orange)} .small{font-size:var(--fs-note)}
.legend{display:flex;flex-wrap:wrap;gap:10px}
.lg{font-size:var(--fs-note);font-weight:700;padding:6px 12px;display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.lg i{width:15px;height:15px;display:inline-block} .lg.off{opacity:.4;text-decoration:line-through}
.chart-box{background:var(--panel);border:1px solid var(--line);padding:18px;max-width:1100px}
.chart-box svg{display:block;width:100%;height:auto}
.pcwrap{position:relative}
.tip{position:absolute;top:8px;pointer-events:none;background:var(--panel-2);border:1px solid var(--line);padding:8px 12px;font-size:var(--fs-note);white-space:nowrap;display:none;z-index:2}
.tip b{color:var(--yellow)}
.mo{display:none}
.foot{display:flex;justify-content:space-between;gap:16px;font-size:var(--fs-note);opacity:.7;max-width:1100px}
.foot .src{text-align:right;white-space:nowrap}
.table-wrap{overflow-x:auto;border:1px solid var(--line)}
.data-table{width:100%;border-collapse:collapse;font-size:var(--fs-cell);white-space:nowrap}
.data-table th{background:var(--panel-2);font-size:var(--fs-head);font-weight:700;text-align:right;padding:13px 10px;border-bottom:2px solid var(--line)}
.data-table td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.data-table th:first-child,.data-table td:first-child{text-align:left}
.data-table tbody tr:hover{background:var(--panel)}
td.up{color:var(--up)} td.down{color:var(--down)}
.h-mo{display:none}
.notes{border-top:2px solid var(--line);padding-top:26px;display:flex;flex-direction:column;gap:10px;font-size:var(--fs-note);opacity:.72;line-height:1.7}
.notes strong{color:var(--yellow);font-weight:700}
@media(max-width:1180px){.kpi-strip{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){.dash{padding:30px 18px 72px;gap:34px} #result{gap:34px} .kpi-strip{grid-template-columns:repeat(2,1fr)}

<body>

<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(u,o)=>{const r=await fetch(u,o&&{method:o.method||'POST',headers:{'content-type':'application/json'},body:o.body&&JSON.stringify(o.body)});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||r.status);return r.json()};
const PAL=['#5B9BD5','#ED7D31','#70C1B3','#C792EA','#E06C75','#9CCC65','#4DD0E1','#B0BEC5'], Y='#FFCB05';
const S={sel:[],geo:'WW',pgeo:'US',unit:'total',kid:null,data:null,tab:'reddit',range:'all',allLabels:false,cmp:new Set(),cmpData:{},hidden:{}};
const REG={};

/* ───── 숫자·날짜 ───── */
/* 숫자 표기: 10 이상은 소수점 없이, 한 자리 수만 소수점 한 자리까지(정수는 그대로) */
const num=v=>{if(Number.isInteger(v))return v;const r=Math.round(v*10)/10;return r>=10?Math.round(v):r};
const fmt=v=>v==null?'–':num(v).toLocaleString();
const fmtS=v=>{if(v==null)return '';const n=num(v);return n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e7?Math.round(n/1e6)+'M':n>=1e6?(n/1e6).toFixed(1)+'M':n>=10000?Math.round(n/1000)+'k':n>=1000?(n/1000).toFixed(1)+'k':String(n)};
const daysIn=(m,d)=>m===d.cur_month?d.days_elapsed:new Date(+m.slice(0,4),+m.slice(5),0).getDate();
function nice(max){if(!(max>0))return[1,.25];const raw=max/4,mag=10**Math.floor(Math.log10(raw)),n=raw/mag,step=(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag;let ym=Math.ceil(max/step)*step;if(ym<max*1.1)ym+=step;return[ym,step]}
const tick=v=>v>=1e6?+(v/1e6).toFixed(2)+'M':v>=1000?v.toLocaleString():+v.toFixed(2)+'';
function visMonths(ms){const n=S.range==='1y'?13:S.range==='3y'?37:ms.length;return ms.slice(-n)}

/* ───── 차트 (손코딩 SVG) ─────
   series: [{name,color,pts:{'2024-01':값|null}}]  o:{title,desc,source,foot,months,cur} */
function chart(id,o){
  const pl=PLAT[S.tab];
  if(pl)o.series.forEach(x=>{if(x.bold||x.isTotal||o.series.length===1)x.color=pl.c});
  const hid=S.hidden[id]||(S.hidden[id]=new Set(o.defaultHidden||[]));
  // 합산 차트: part 계열은 선으로 그리지 않고, 범례에서 켜진 것만 합계에 더함
  const parts=o.series.filter(s=>s.part),inc=parts.filter(s=>!hid.has(s.name));
  o.series.forEach(s=>{if(s.isTotal){const pts={};o.months.forEach(m=>{const v=inc.map(p=>p.pts[m]).filter(x=>x!=null);if(v.length)pts[m]=v.reduce((a,b)=>a+b,0)});s.pts=pts}});
  const series=o.series.filter(s=>!s.part&&!hid.has(s.name));
  let months=o.daily?o.months:visMonths(o.months);
  const f0=months.findIndex(m=>series.some(s=>s.pts[m]!=null&&s.pts[m]>0));   // 데이터가 시작되기 전 빈 기간은 잘라냄
  if(f0>0)months=months.slice(f0);
  REG[id]={months,series,o};
  const chip=s=>{const none=s.part&&!Object.values(s.pts).some(v=>v!=null);return `<button class="lg ${hid.has(s.name)?'off':''} ${none?'pend':''}" data-chart="${id}" data-s="${esc(s.name)}"><i style="background:${s.color}"></i>${esc(s.name)}${none?' · 수집 중':''}</button>`};
  const lg=parts.length?`<div class="legend"><span class="lg-cap">합계 포함 ${inc.length}/${parts.length}</span>${parts.map(chip).join('')}</div>`
    :o.series.length>1?`<div class="legend">${o.series.map(chip).join('')}</div>`:'';
  const empty=!series.some(s=>months.some(m=>s.pts[m]!=null));
  // 머리말 숫자: 대표 선(합계 또는 하나뿐인 선)의 최근 완료 기간 값과 1년 전 대비
  const main=series.find(s=>s.isTotal||s.bold)||(series.length===1?series[0]:null);
  let head='';
  if(main&&!empty){const done=months.filter(m=>m!==o.cur&&main.pts[m]!=null),lm=done[done.length-1];
    if(lm){const v=main.pts[lm],back=o.daily?52:12,pm=done[done.length-1-back],pv=pm!=null?main.pts[pm]:null,ch=pv>0?(v-pv)/pv*100:null;
      head=`<div class="chd"><span class="chd-v">${fmtS(v)}</span><span class="chd-m">${lm}</span>${ch==null?'':`<span class="chd-c ${ch>=0?'up':'down'}">${ch>=0?'▲':'▼'} ${Math.abs(ch).toFixed(Math.abs(ch)<10?1:0)}% <small>YoY</small></span>`}</div>`}}
  return `<section class="panel chart-panel"${pl?` style="--acc:${pl.c}"`:''}><div class="panel-head"><h2>${pl?pl.i:''}${esc(o.title)}</h2><span class="unit">${o.desc||''}</span></div>${head}${lg}
   ${empty?'<div class="box dim">수집 중</div>':`<div class="chart-box pcwrap">${lineSvg(id,months,series,o)}<div class="tip"></div></div>`}
</section>`;
}
function maxOf(series,months){let mx=0;series.forEach(s=>months.forEach(m=>{const v=s.pts[m];if(v!=null&&v>mx)mx=v}));return mx}
const SZ=()=>innerWidth<640?{W:420,H:250,L:40,R:46,T:14,B:26,f:11}:{W:1100,H:400,L:56,R:70,T:18,B:34,f:13};
function lineSvg(id,months,series,o){
  const Z=SZ(),{W,H,L,R,T,B,f}=Z,pw=W-L-R,ph=H-T-B,n=months.length;
  const X=i=>L+(n>1?i/(n-1):.5)*pw,[ym,step]=nice(maxOf(series,months)),Yv=v=>T+ph-v/ym*ph;
  const ci=months.indexOf(o.cur);
  let g=`<defs>${series.map((s,k)=>`<linearGradient id="gr-${id}-${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".22"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`).join('')}</defs>`;
  for(let v=0;v<=ym+1e-9;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${Yv(v)}" y2="${Yv(v)}" stroke="#ffffff" stroke-opacity="${v?.06:.18}"/><text x="${L-8}" y="${Yv(v)+f*.35}" text-anchor="end" fill="#7d8996" font-size="${f}">${fmtS(v)}</text>`;
  // x축: 해가 바뀌는 곳에 연도, 짧은 기간이면 분기/월
  const yrs=new Set(months.map(m=>m.slice(0,4))).size;
  months.forEach((m,i)=>{const mm=m.slice(5,7),first=i===0||m.slice(0,4)!==months[i-1].slice(0,4);let t='';
    if(o.daily){if(first)t=m.slice(0,4);else if(yrs<=2&&m.slice(5,7)!==months[i-1].slice(5,7)&&['04','07','10'].includes(mm))t=+mm+'월'}
    else if(yrs>2){if(first)t=m.slice(0,4)}else if(first)t=m.slice(0,4);else if(['04','07','10'].includes(mm))t=+mm+'월';
    if(t)g+=`<text x="${X(i)}" y="${H-B+f+8}" text-anchor="middle" fill="${first?'#c5cdd6':'#7d8996'}" font-size="${f}">${t}</text>`+(first&&i?`<line x1="${X(i)}" x2="${X(i)}" y1="${T}" y2="${T+ph}" stroke="#fff" stroke-opacity=".06"/>`:'')});
  const ends=[];
  series.forEach((s,k)=>{let d='',pen=false,first=null,last=null;
    months.forEach((m,i)=>{const v=s.pts[m];if(v==null||i===ci){pen=false;return}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Yv(v).toFixed(1);pen=true;if(first==null)first=i;last=i});
    if(!d)return;
    if(series.length===1&&first!=null)g+=`<path d="${d}L${X(last).toFixed(1)} ${T+ph}L${X(first).toFixed(1)} ${T+ph}Z" fill="url(#gr-${id}-${k})"/>`;
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.bold||s.isTotal||series.length===1?2.4:1.8}" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(ci>0&&s.pts[o.cur]!=null&&s.pts[months[ci-1]]!=null)g+=`<line x1="${X(ci-1)}" y1="${Yv(s.pts[months[ci-1]])}" x2="${X(ci)}" y2="${Yv(s.pts[o.cur])}" stroke="${s.color}" stroke-width="1.6" stroke-dasharray="3 4" stroke-opacity=".7"/>`;
    months.forEach((m,i)=>{const v=s.pts[m];if(v==null||i===ci)return;g+=`<circle cx="${X(i)}" cy="${Yv(v)}" r="${i===last?4:n>60?1.8:2.6}" fill="${s.color}" stroke="#11171d" stroke-width="1"/>`});
    if(last!=null)ends.push(last)});
  // 점마다 값: 최근 12개 + 연말 + 마지막 점. 겹치면 위→아래→더 위 순으로 피하고 자리가 없으면 생략
  const boxes=[],hit=(a,b)=>a[0]<b[0]+b[2]&&b[0]<a[0]+a[2]&&a[1]<b[1]+b[3]&&b[1]<a[1]+a[3],cw=f*.62;
  const lastI=Math.max(...ends,-1);
  [...months.keys()].reverse().forEach(i=>{const m=months[i];if(i===ci||!(i>=n-12||(!o.daily&&m.endsWith('-12'))||i===lastI))return;
    series.forEach(s=>{const v=s.pts[m];if(v==null)return;const t=fmtS(v),w=t.length*cw+4,x=Math.min(Math.max(X(i),L+w/2),W-R+w/2),y=Yv(v);
      for(const dy of [-8,f+6,-8-f-2]){const b=[x-w/2,y+dy-f,w,f+2];if(b[1]<0||b[1]+f>T+ph+4||boxes.some(o2=>hit(b,o2)))continue;boxes.push(b);
        g+=`<text x="${x}" y="${y+dy}" text-anchor="middle" fill="${series.length>1?s.color:'#e8edf2'}" font-size="${f-1}" font-weight="${i===lastI?800:500}" paint-order="stroke" stroke="#11171d" stroke-width="3">${t}</text>`;break}})});
  g+=`<line class="guide" y1="${T}" y2="${T+ph}" stroke="#fff" stroke-opacity=".3" style="display:none"/><g class="hov"></g>`;
  return `<svg viewBox="0 0 ${W} ${H}" data-id="${id}" role="img" aria-label="${esc(o.title)}">${g}</svg>`;
}
function hover(e){const svg=e.target.closest&&e.target.closest('.pcwrap svg');if(!svg)return;
  const r=REG[svg.dataset.id];if(!r)return;const Z=SZ(),{W,L,R,T,H,B}=Z,pw=W-L-R,ph=H-T-B,b=svg.getBoundingClientRect(),n=r.months.length;
  const cx=(e.touches?e.touches[0].clientX:e.clientX);
  const i=Math.max(0,Math.min(n-1,Math.round(((cx-b.left)/b.width*W-L)/pw*(n-1)))),x=L+(n>1?i/(n-1):.5)*pw,m=r.months[i];
  const [ym]=nice(maxOf(r.series,r.months)),Yv=v=>T+ph-v/ym*ph;
  const gl=svg.querySelector('.guide');gl.setAttribute('x1',x);gl.setAttribute('x2',x);gl.style.display='';
  svg.querySelector('.hov').innerHTML=r.series.filter(s=>s.pts[m]!=null).map(s=>`<circle cx="${x}" cy="${Yv(s.pts[m])}" r="4.5" fill="${s.color}" stroke="#fff" stroke-width="1.5"/>`).join('');
  const tip=svg.parentNode.querySelector('.tip');
  tip.innerHTML=`<div class="tip-h">${m}${m===r.o.cur?' · 진행 중':''}</div>`+r.series.filter(s=>s.pts[m]!=null).sort((a,b)=>b.pts[m]-a.pts[m]).map(s=>`<div class="tip-r"><i style="background:${s.color}"></i><span>${esc(s.name)}</span><b>${fmt(s.pts[m])}</b></div>`).join('');
  tip.style.display='block';const px=x/W*b.width;tip.style.left=Math.max(0,px>b.width/2?px-tip.offsetWidth-14:px+14)+'px'}
function unhover(svg){svg.querySelector('.guide').style.display='none';svg.querySelector('.hov').innerHTML='';svg.parentNode.querySelector('.tip').style.display='none'}
document.addEventListener('mousemove',hover);document.addEventListener('touchmove',hover,{passive:true});document.addEventListener('touchstart',hover,{passive:true});
document.addEventListener('mouseout',e=>{const svg=e.target.closest&&e.target.closest('.pcwrap svg');if(svg&&!svg.contains(e.relatedTarget))unhover(svg)});
addEventListener('resize',()=>{clearTimeout(S.rz);S.rz=setTimeout(()=>render(),200)});

/* ───── 지표 계산 ───── */
function ownSeries(d,idx){ // idx 0=글, 1=댓글 → 하루 평균
  return Object.entries(d.own).map(([sub,ms],i)=>({name:'r/'+sub,color:PAL[i%PAL.length],mode:S.unit==='daily'?'daily':'avg',raw:Object.fromEntries(Object.entries(ms).map(([m,v])=>[m,v[idx]])),
    pts:Object.fromEntries(Object.entries(ms).map(([m,v])=>[m,S.unit==='daily'?v[idx]/daysIn(m,d):v[idx]]))}));
}
const UN=()=>S.unit==='daily'?{t:'하루 평균 ',u:'개/일',s:'/일',n:''}:{t:'월별 ',u:'개/월',s:'/월',n:' 진행 중인 달은 오늘까지의 합계라 낮게 보임.'};
function sumAny(name,list,months){const pts={};months.forEach(m=>{const v=list.map(s=>s.pts[m]).filter(x=>x!=null);if(v.length)pts[m]=v.reduce((a,b)=>a+b,0)});return{name,color:Y,bold:true,pts,mode:'avg'}}
const ownAll=(d,idx)=>{const l=ownSeries(d,idx);if(l.length<2)return l;if(S.unit!=='daily')return totalOf('합계',l);const t=sumAny('합계',l,d.months);if(S.unit==='daily'){t.mode='daily';t.raw={};d.months.forEach(m=>{const v=l.map(s=>s.raw[m]).filter(x=>x!=null);if(v.length)t.raw[m]=v.reduce((a,b)=>a+b,0)})}return[t,...l]};
function totalOf(name,list){return[{name,color:Y,bold:true,isTotal:true,pts:{}},...list.map(x=>({...x,part:true}))]}
function sumSeries(name,list,months){const pts={};months.forEach(m=>{if(list.length&&list.every(s=>s.pts[m]!=null))pts[m]=list.reduce((a,s)=>a+s.pts[m],0)});return{name,color:Y,bold:true,pts}}
function mentionParts(d,key,pre){return Object.entries(d[key||'mentions']||{}).map(([sub,ms],i)=>({name:(pre||'')+'r/'+sub,color:PAL[i%PAL.length],pts:Object.fromEntries(Object.entries(ms).map(([m,by])=>[m,Object.values(by).reduce((a,b)=>a+b,0)]))}))}
function mentionBySub(d,key){const l=mentionParts(d,key);return l.length>1?[sumSeries('합계',l,d.months),...l]:l}
function mentionByTerm(d){const subs=Object.values(d.mentions);const l=d.variants.map((t,i)=>{const pts={};d.months.forEach(m=>{if(subs.length&&subs.every(ms=>ms[m]))pts[m]=subs.reduce((a,ms)=>a+ms[m][t],0)});return{name:t,color:PAL[i%PAL.length],pts}});
  return l.length>1?[sumSeries('합계',l,d.months),...l]:l}
const GP={web:'구글',youtube:'유튜브'},GEO={US:'미국',WW:'전세계',JA:'일본어'};
const jaName=d=>d&&d.ja?`${d.ja.term} (${d.ja.ko})`:'';
function trendSeries(d,gprop,geo){
  const l=d.trends.filter(s=>s.gprop===gprop&&s.geo===geo).map((s,i)=>({name:s.term,color:PAL[i%PAL.length],pts:Object.fromEntries(Object.entries(s.points).map(([m,v])=>[m,v[0]]))}));
  if(l.length>1){const t=sumSeries('합계',l,d.months);t.isSum=true;return[t,...l]}
  return l}
const trendMain=(d,gprop,geo)=>{const l=trendSeries(d,gprop,geo);return l.find(s=>s.isSum)||l[0]};
function trendChart(d,gprop){
  if(S.geo==='JA'&&gprop!=='web')S.geo='WW';
  if(S.geo==='JA'&&!d.ja)return '<div class="box dim">일본어 검색어 없음 (일본 브랜드만)</div>';
  const w=(d.trends_w||[]).find(t=>t.gprop===gprop&&t.geo===S.geo);
  if(S.geo==='JA'&&!(w&&Object.keys(w.points).length))return `<div class="box dim">일본어 검색 ${esc(jaName(d))} · 수집 중</div>`;
  if(w&&Object.keys(w.points).length){   // 주간 값이 있으면 주간으로
    let weeks=Object.keys(w.points).sort();const n=S.range==='1y'?53:S.range==='3y'?157:weeks.length;weeks=weeks.slice(-n);
    const cur=weeks.find(k=>w.points[k][1])||null;
    return chart(`trendw-${gprop}-${S.geo}`,{daily:true,months:weeks,cur,title:S.geo==='JA'?`구글 · 일본어 검색 「${esc(jaName(d))}」 (주간)`:`${GP[gprop]} · 검색 관심도 (${GEO[S.geo]}, 주간)`,desc:'지수 0~100',
      series:[{name:'검색 관심도',color:PAL[0],pts:Object.fromEntries(weeks.map(k=>[k,w.points[k][0]]))}],source:''});
  }
  return chart(`trend-${gprop}-${S.geo}`,{months:d.months,cur:d.cur_month,title:`${GP[gprop]} · 검색 관심도 (${GEO[S.geo]})`,
    desc:'지수 0~100',
    series:trendSeries(d,gprop,S.geo),source:'Google Trends (비공식)',foot:''});
}

/* ───── 연간 요약표 (완료된 달만) ───── */
function yearAgg(s,d,year,upto){let a=0,b=0;d.months.forEach(m=>{if(m===d.cur_month||+m.slice(0,4)!==year||(upto&&+m.slice(5)>upto))return;
    if(s.mode==='daily'){if(s.raw[m]!=null){a+=s.raw[m];b+=daysIn(m,d)}}else if(s.pts[m]!=null){a+=s.pts[m];b++}});return b?a/b:null}
function yearTable(d){

setInterval(loadAlerts,600000);
async function loadSaved(){
  S.ks=await api('/api/keywords');renderSaved();if(!S.alerts)loadAlerts();if(!S.data)render();

}
let selTok=0;
async function select(id){   // 누를 때마다 선택에 넣고/빼기. 2개 이상이면 겹쳐서 비교
  if(S.sel.includes(id))S.sel=S.sel.filter(x=>x!==id);else S.sel.push(id);
  renderSaved();   // 누른 즉시 선택 표시
  if(!S.sel.length){S.kid=null;S.data=null;$('#progress').style.display='none';render();return}
  const tok=++selTok;S.kid=S.sel[S.sel.length-1];
  if(S.cmpData[S.kid]){S.data=S.cmpData[S.kid];render()}   // 받아 둔 게 있으면 바로 그림
  else{S.data=null;$('#result').innerHTML='<section class="panel"><div class="box dim">불러오는 중…</div></section>'}
  try{await Promise.all(S.sel.filter(i=>!S.cmpData[i]).map(async i=>{S.cmpData[i]=await api('/api/keywords/'+i+'/data')}))}catch(e){}
  if(tok!==selTok)return;   // 그 사이 다른 걸 눌렀으면 이전 응답은 버림
  S.data=S.cmpData[S.kid]||null;lastLoad=Date.now();lastDone=-2;render()}

/* ───── 1단계: 후보 확인 ───── */
$('#btnSuggest').onclick=async()=>{
  const kw=$('#kw').value.trim();if(!kw)return;$('#cand').innerHTML='<div class="box dim">찾는 중…</div>';
  try{const r=await api('/api/suggest',{body:{keyword:kw}});
    $('#cand').innerHTML=`<div class="box"><b>변형</b> 
      <div class="row">${r.variants.map(v=>`<label class="ck"><input type="checkbox" class="vck" value="${esc(v)}" ${(r.checked||r.variants).includes(v)?'checked':''}>${esc(v)}</label>`).join('')}</div>
      <input type="text" id="vAdd" placeholder="변형 추가 (쉼표 구분)" class="wide"></div>
     <div class="box"><b>전용 서브레딧</b> ${r.error?`<span class="warn small">${esc(r.error)} — 아래에 직접 입력하거나 다시 시도</span>`:''}
      <div class="row">${r.subs.map(s=>`<label class="ck"><input type="checkbox" class="ock" value="${esc(s.name)}" ${s.exact?'checked':''}>r/${esc(s.name)} <span class="dim">구독 ${s.subscribers.toLocaleString()}${s.created_utc?' · '+new Date(s.created_utc*1000).toISOString().slice(0,7)+' 생성':''}</span></label>`).join('')||'<span class="dim">이름이 비슷한 서브레딧을 못 찾음</span>'}</div>
      <input type="text" id="oAdd" placeholder="전용 서브레딧 추가" class="wide"></div>
     <div class="box"><b>언급을 볼 다른 서브레딧</b> 
      <input type="text" id="mAdd" placeholder="예: transformers, ActionFigures" class="wide"></div>
     <button class="btn main" id="btnStart">수집 시작</button>`;
  }catch(e){$('#cand').innerHTML=`<p class="warn">${esc(e.message)}</p>`}
};
$('#kw').onkeydown=e=>{if(e.key==='Enter')$('#btnSuggest').click()};
const split=s=>(s||'').split(',').map(x=>x.trim()).filter(Boolean);
const vals=sel=>[...document.querySelectorAll(sel+':checked')].map(x=>x.value);

document.addEventListener('click',async e=>{
  // 신고가 모니터: 그 키워드 하나만 골라 해당 플랫폼 차트로 이동(누른 칸의 플랫폼, 아니면 신고가 난 플랫폼)
  const row=e.target.closest('tr.mxrow');
  if(row){const td=e.target.closest('td[data-t]');S.tab=(td||row).dataset.t;S.sel=[];await select(+row.dataset.id);
    const r=$('#result');if(r)window.scrollTo({top:r.getBoundingClientRect().top+scrollY-8,behavior:'smooth'});return}
  const t=e.target.closest('button')||e.target;   // 버튼 안의 글자·아이콘을 눌러도 버튼으로 인식
  if(t.id==='btnStart'){const r=await api('/api/keywords',{body:{name:$('#kw').value,variants:[...vals('.vck'),...split($('#vAdd').value)],own_subs:[...vals('.ock'),...split($('#oAdd').value)],mention_subs:split($('#mAdd').value)}});$('#cand').innerHTML='';$('#kw').value='';S.tab='reddit';select(r.id)}
  else if(t.closest('.kcat')){S.cat=t.closest('.kcat').dataset.cat;renderSaved()}
  else if(t.classList.contains('sortby')){S.sortBy=t.dataset.o;ls('kt_sort',S.sortBy);renderSaved()}
  else if(t.classList.contains('kwbtn'))select(+t.dataset.id);
  else if(t.classList.contains('grpby')){S.groupBy=t.dataset.g;ls('kt_group',S.groupBy);renderSaved()}
  else if(t.classList.contains('tab')){S.tab=t.dataset.tab;render()}
  else if(t.classList.contains('rng')){S.range=t.dataset.r;render()}
  else if(t.classList.contains('unit')){S.unit=t.dataset.u;render()}
  else if(t.classList.contains('geo')){S.geo=t.dataset.g;render()}
  else if(t.classList.contains('pgeo')){S.pgeo=t.dataset.pg;render()}
  else if(t.id==='btnLabels'){S.allLabels=!S.allLabels;render()}
  else if(t.closest('.lg')){const b=t.closest('.lg'),h=S.hidden[b.dataset.chart];h.has(b.dataset.s)?h.delete(b.dataset.s):h.add(b.dataset.s);render()}
  else if(t.id==='btnAddSubs'){const subs=[...vals('.candck'),...split($('#addSubs').value)];if(subs.length){await api(`/api/keywords/${S.kid}/mention_subs`,{body:{subs}});loadData()}}
  else if(t.id==='btnProbe'){const subs=split($('#addSubs').value);if(subs.length){await api(`/api/keywords/${S.kid}/probe`,{body:{subs}});$('#addSubs').value='';lastDone=-1}}
  else if(t.classList.contains('rmsub')){e.preventDefault();if(confirm(`r/${t.dataset.s} 을(를) 빼고 남은 수집을 취소할까요?`)){await api(`/api/keywords/${S.kid}/subs/${encodeURIComponent(t.dataset.s)}`,{method:'DELETE'});loadData()}}
  else if(t.id==='btnYtKey'){const m=$('#ytKeyMsg');m.textContent='키 확인 중…';try{await api('/api/settings/youtube',{body:{key:$('#ytKey').value}});lastDone=-1;await loadData()}catch(err){m.textContent=err.message}}
  else if(t.id==='btnCsv')location.href=`/api/keywords/${S.kid}/export.csv`;
  else if(t.id==='btnFull'){await api(`/api/keywords/${S.kid}/full`,{});await loadData()}
  else if(t.id==='btnRefresh'){await api(`/api/keywords/${S.kid}/refresh`,{});lastDone=-1}
  else if(t.id==='btnDel'){if(confirm(`'${S.data.keyword}' 키워드와 수집 대기열을 삭제할까요?`)){await api('/api/keywords/'+S.kid,{method:'DELETE'});S.sel=S.sel.filter(x=>x!==S.kid);S.kid=S.sel[0]||null;S.data=null;$('#progress').style.display='none';render();loadSaved()}}
  else if(t.id==='btnHtml')exportHtml();
  else if(t.id==='btnSelClear'){S.sel=[];S.kid=null;S.data=null;$('#progress').style.display='none';renderSaved();render()}
});
document.addEventListener('input',e=>{if(e.target.id==='kwFilter'){S.kwq=e.target.value;renderSaved()}});
document.addEventListener('change',async e=>{if(e.target.classList.contains('gsel')){const c=$('#gCat').value,n=$('#gCtr').value;await api(`/api/keywords/${S.kid}/group`,{body:{category:c,country:n}});S.ks=await api('/api/keywords');renderSaved();return}
});

/* ───── 내보내기: 차트 포함 단일 HTML ───── */
function exportHtml(){
  const d=S.data,keep=S.tab;let body='';
  body=(d.global&&d.global.enabled?viewGlobal(d):'')+viewOwn(d)+mentionCharts(d)+viewYT(d)+viewTiktok(d)+viewGoogle(d)+yearTable(d);
  const html=`<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(d.keyword)} · Trend Samurai</title>
<link href="https://fonts.googleapis.com/css2?family=42dot+Sans:wght@300..800&display=swap" rel="stylesheet"><style>${$('#css').textContent} .lg{pointer-events:none}</style></head><body><main class="dash"><header class="dash-head"><div><h1>${esc(d.keyword).toUpperCase()}</h1></div></header><section class="kpi-strip">${kpis(d)}</section>${body}
</main></body></html>`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=`${d.keyword}-report-${d.today}.html`;a.click();
}
loadSaved();pollStatus();
</script>
</body>
