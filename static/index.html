<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>키워드 트래커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=42dot+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style id="css">
:root{--bg:#0f1419;--card:#161d25;--box:#1b232c;--line:#2a3540;--y:#FFCB05;--b:#5B9BD5;--o:#ED7D31;--t:#FFFFFF;--dim:#9aa7b3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font-family:"42dot Sans",system-ui,sans-serif;font-size:17px;line-height:1.5}
main{max-width:1132px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 16px}
h2{font-size:20px;margin:0 0 10px}
h3{font-size:21px;margin:0 0 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:0;padding:18px;margin:0 0 16px}
.box{background:var(--box);border:1px solid var(--line);padding:10px 12px;margin:8px 0}
.desc{color:var(--dim);font-size:15px;margin:0 0 10px}
.foot{display:flex;justify-content:space-between;gap:12px;color:var(--dim);font-size:13px;margin-top:8px}
.foot .src{text-align:right;white-space:nowrap}
input[type=text]{background:var(--bg);border:1px solid var(--line);color:var(--t);font:inherit;padding:8px 10px;border-radius:0;min-width:0}
button{background:var(--box);border:1px solid var(--line);color:var(--t);font:inherit;font-size:15px;padding:7px 12px;border-radius:0;cursor:pointer}
button:hover{border-color:var(--b)}
button.on{border-color:var(--y);color:var(--y)}
button.main{background:var(--y);color:#111;border-color:var(--y);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label.ck{display:inline-flex;gap:6px;align-items:center;background:var(--box);border:1px solid var(--line);padding:5px 10px;font-size:15px}
.dim{color:var(--dim)} .warn{color:var(--o)} .small{font-size:14px}
.bar{height:10px;background:var(--box);border:1px solid var(--line);margin:8px 0}
.bar i{display:block;height:100%;background:var(--y)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.lg{font-size:14px;padding:3px 9px;display:inline-flex;align-items:center;gap:6px}
.lg i{width:12px;height:12px;display:inline-block}
.lg.off{opacity:.4;text-decoration:line-through}
.chart{position:relative;max-width:1100px}
.chart svg{display:block;width:100%;height:auto}
.pcwrap{position:relative}
.tip{position:absolute;top:8px;pointer-events:none;background:var(--box);border:1px solid var(--line);padding:6px 10px;font-size:14px;white-space:nowrap;display:none;z-index:2}
.tip b{color:var(--y)}
.mo{display:none}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:right;white-space:nowrap}
th{background:var(--box);font-weight:500} td:first-child,th:first-child{text-align:left}
td.up{color:var(--y)} td.down{color:var(--o)}
.h-mo{display:none}
@media(max-width:600px){
  body{font-size:15px} main{padding:8px} .card{padding:12px} h3{font-size:17px}
  .pc{display:none} .mo{display:block}
  table{font-size:10.5px} th,td{padding:4px 2px} .h-pc{display:none} .h-mo{display:inline}
  .foot{flex-direction:column;gap:2px} .foot .src{text-align:left}
}
</style>
</head>
<body>
<main>
<h1>키워드 트래커 <span class="dim small">레딧 + 검색 관심도</span></h1>

<section class="card" id="add">
  <h2>1. 키워드 추가</h2>
  <div class="row">
    <input type="text" id="kw" placeholder="예: blokees" style="flex:1">
    <button class="main" id="btnSuggest">후보 찾기</button>
  </div>
  <div id="cand"></div>
</section>

<section class="card">
  <h2>저장된 키워드</h2>
  <div class="row" id="saved"><span class="dim">아직 없음</span></div>
  <div class="row small dim" id="cmpRow" style="margin-top:8px"></div>
</section>

<section class="card" id="progress" style="display:none"></section>

<section id="result"></section>
</main>

<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(u,o)=>{const r=await fetch(u,o&&{method:o.method||'POST',headers:{'content-type':'application/json'},body:o.body&&JSON.stringify(o.body)});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||r.status);return r.json()};
const PAL=['#5B9BD5','#ED7D31','#70C1B3','#C792EA','#E06C75','#9CCC65','#4DD0E1','#B0BEC5'], Y='#FFCB05';
const S={kid:null,data:null,tab:'own',range:'all',allLabels:false,cmp:new Set(),cmpData:{},hidden:{}};
const REG={};

/* ───── 숫자·날짜 ───── */
const fmt=v=>v==null?'–':Number.isInteger(v)?v.toLocaleString():v>=100?Math.round(v).toLocaleString():v>=10?v.toFixed(1):v>=1?v.toFixed(2):v===0?'0':v.toFixed(2);
const fmtS=v=>v==null?'':Number.isInteger(v)&&v<1000?String(v):v>=10000?Math.round(v/1000)+'k':v>=1000?(v/1000).toFixed(1)+'k':v>=100?String(Math.round(v)):v>=10?v.toFixed(1):v===0?'0':v.toFixed(2);
const daysIn=(m,d)=>m===d.cur_month?d.days_elapsed:new Date(+m.slice(0,4),+m.slice(5),0).getDate();
function nice(max){if(!(max>0))return[1,.25];const raw=max/4,mag=10**Math.floor(Math.log10(raw)),n=raw/mag,step=(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag;let ym=Math.ceil(max/step)*step;if(ym<max*1.1)ym+=step;return[ym,step]}
const tick=v=>v>=1000?v.toLocaleString():+v.toFixed(2)+'';
function visMonths(ms){const n=S.range==='1y'?13:S.range==='3y'?37:ms.length;return ms.slice(-n)}

/* ───── 차트 (손코딩 SVG) ─────
   series: [{name,color,pts:{'2024-01':값|null}}]  o:{title,desc,source,foot,months,cur} */
function chart(id,o){
  const hid=S.hidden[id]||(S.hidden[id]=new Set(o.defaultHidden||[]));
  const months=visMonths(o.months), series=o.series.filter(s=>!hid.has(s.name));
  REG[id]={months,series};
  const lg=o.series.length>1?`<div class="legend">${o.series.map(s=>`<button class="lg ${hid.has(s.name)?'off':''}" data-chart="${id}" data-s="${esc(s.name)}"><i style="background:${s.color}"></i>${esc(s.name)}</button>`).join('')}</div>`:'';
  const empty=!series.some(s=>months.some(m=>s.pts[m]!=null));
  return `<div class="card chart"><h3>${esc(o.title)}</h3><p class="desc">${o.desc}</p>${lg}
   ${empty?'<div class="box dim">아직 받은 데이터가 없습니다. 수집되는 대로 표시됩니다.</div>':
   `<div class="pc pcwrap">${pcSvg(id,months,series,o)}<div class="tip"></div></div><div class="mo">${moSvg(months,series,o)}</div>`}
   <div class="foot"><span>${o.foot||''} 점선 = 진행 중인 달. 노란 점 = 최신 완료월.</span><span class="src">출처: ${esc(o.source)}</span></div></div>`;
}
function maxOf(series,months){let mx=0;series.forEach(s=>months.forEach(m=>{const v=s.pts[m];if(v!=null&&v>mx)mx=v}));return mx}
const PC={W:1100,H:440,L:66,R:44,T:30,B:44};
function pcSvg(id,months,series,o){
  const {W,H,L,R,T,B}=PC,pw=W-L-R,ph=H-T-B,n=months.length;
  const X=i=>L+(n>1?i/(n-1):.5)*pw,[ym,step]=nice(maxOf(series,months)),Yv=v=>T+ph-v/ym*ph;
  const ci=months.indexOf(o.cur), li=ci>0?ci-1:(ci<0?n-1:-1);
  let g='';
  for(let v=0;v<=ym+1e-9;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${Yv(v)}" y2="${Yv(v)}" stroke="#2a3540"/><text x="${L-10}" y="${Yv(v)+5}" text-anchor="end" fill="#9aa7b3" font-size="15">${tick(v)}</text>`;
  months.forEach((m,i)=>{const jan=m.endsWith('-01');if(n<=13||jan||(n<=37&&m.endsWith('-07')))g+=`<text x="${X(i)}" y="${H-B+24}" text-anchor="middle" fill="${jan?'#fff':'#9aa7b3'}" font-size="15">${n<=13?m.slice(2):jan?m.slice(0,4):m.slice(5)+'월'}</text>`+(jan?`<line x1="${X(i)}" x2="${X(i)}" y1="${T}" y2="${T+ph}" stroke="#2a3540" stroke-dasharray="2 4"/>`:'')});
  series.forEach(s=>{
    let d='',pen=false;
    months.forEach((m,i)=>{const v=s.pts[m];if(v==null||i===ci){pen=false;return}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Yv(v).toFixed(1);pen=true});
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.bold?3:2.2}" stroke-linejoin="round"/>`;
    if(ci>0&&s.pts[o.cur]!=null&&s.pts[months[ci-1]]!=null)g+=`<line x1="${X(ci-1)}" y1="${Yv(s.pts[months[ci-1]])}" x2="${X(ci)}" y2="${Yv(s.pts[o.cur])}" stroke="${s.color}" stroke-width="2.2" stroke-dasharray="6 5"/>`;
    months.forEach((m,i)=>{const v=s.pts[m];if(v==null)return;
      if(i===li)g+=`<circle cx="${X(i)}" cy="${Yv(v)}" r="6" fill="${Y}" stroke="#0f1419" stroke-width="2"/>`;
      else if(i===ci)g+=`<circle cx="${X(i)}" cy="${Yv(v)}" r="3.5" fill="#0f1419" stroke="${s.color}" stroke-width="2"/>`;
      else if(n<=40)g+=`<circle cx="${X(i)}" cy="${Yv(v)}" r="2.6" fill="${s.color}"/>`});
  });
  /* 값 라벨: 기본은 최신 12개월 + 각 연말. 겹치면 위→아래→더 위 순으로 피하고, 자리가 없으면 생략 */
  const boxes=[],hit=(a,b)=>a[0]<b[0]+b[2]&&b[0]<a[0]+a[2]&&a[1]<b[1]+b[3]&&b[1]<a[1]+a[3];
  const order=[li,...months.map((_,i)=>n-1-i).filter(i=>i!==li)].filter(i=>i>=0);
  order.forEach(i=>{const m=months[i];if(!(S.allLabels||(series.length<3&&i>=n-12)||m.endsWith('-12')||i===li))return;
    series.forEach(s=>{const v=s.pts[m];if(v==null)return;const t=fmt(v),w=t.length*8.4+6,x=Math.min(Math.max(X(i),L+w/2),W-w/2-2),y=Yv(v);
      for(const dy of [-11,22,-27,38]){const b=[x-w/2,y+dy-14,w,17];if(b[1]<2||b[1]+17>T+ph+2||boxes.some(o2=>hit(b,o2)))continue;boxes.push(b);
        g+=`<text x="${x}" y="${y+dy}" text-anchor="middle" fill="${i===li?Y:s.color}" font-size="14" font-weight="${i===li?700:500}" paint-order="stroke" stroke="#161d25" stroke-width="4">${t}</text>`;break}})});
  if(ci>=0)g+=`<text x="${W-R}" y="${T-12}" text-anchor="end" fill="#9aa7b3" font-size="14">┄ ${o.cur} 진행 중</text>`;
  g+=`<line class="guide" y1="${T}" y2="${T+ph}" stroke="#fff" stroke-opacity=".35" style="display:none"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" data-id="${id}" role="img">${g}</svg>`;
}
/* 폰 전용: 세로로 긴 차트. 최신 달이 맨 위, 아래로 갈수록 과거. 값은 오른쪽 열에 표로 */
function moSvg(months,series,o){
  const f0=months.findIndex(m=>series.some(s=>s.pts[m]!=null));months=months.slice(Math.max(0,f0-1));const ms=[...months].reverse(),rh=18,top=34,W=360,L=46,k=series.length,cw=Math.max(27,Math.min(46,Math.floor(160/k))),tw=cw*k;
  const x0=L+4,pw=W-L-tw-18,[ym]=nice(maxOf(series,months)),Xv=v=>x0+v/ym*pw,Yi=i=>top+i*rh+rh/2,H=top+ms.length*rh+8;
  const ci=ms.indexOf(o.cur),li=ci>=0?ci+1:0;
  let g=`<text x="${x0}" y="12" fill="#9aa7b3" font-size="10">0</text><text x="${x0+pw}" y="12" text-anchor="end" fill="#9aa7b3" font-size="10">${tick(ym)}</text>
   <line x1="${x0}" x2="${x0}" y1="${top}" y2="${H-8}" stroke="#2a3540"/><line x1="${x0+pw}" x2="${x0+pw}" y1="${top}" y2="${H-8}" stroke="#2a3540" stroke-dasharray="2 4"/>`;
  series.forEach((s,j)=>g+=`<rect x="${W-tw+j*cw+cw/2-5}" y="14" width="10" height="10" fill="${s.color}"/>`);
  ms.forEach((m,i)=>{const jan=m.endsWith('-01');
    if(i===li)g+=`<rect x="0" y="${top+i*rh}" width="${W}" height="${rh}" fill="#1b232c"/>`;
    if(jan)g+=`<line x1="0" x2="${W}" y1="${top+(i+1)*rh}" y2="${top+(i+1)*rh}" stroke="#2a3540"/>`;
    g+=`<text x="2" y="${Yi(i)+4}" fill="${i===li?Y:jan||i===0?'#fff':'#9aa7b3'}" font-size="11">${m.slice(2)}${i===ci?'*':''}</text>`;
    series.forEach((s,j)=>{const v=s.pts[m];if(v!=null)g+=`<text x="${W-tw+(j+1)*cw-2}" y="${Yi(i)+4}" text-anchor="end" fill="${i===li?Y:s.color}" font-size="${k>4?9.5:11}" font-weight="${i===li?700:400}">${fmtS(v)}</text>`})});
  series.forEach(s=>{let d='',pen=false;
    ms.forEach((m,i)=>{const v=s.pts[m];if(v==null||i===ci){pen=false;return}d+=(pen?'L':'M')+Xv(v).toFixed(1)+' '+Yi(i);pen=true});
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.8"/>`;
    if(ci>=0&&s.pts[o.cur]!=null&&s.pts[ms[ci+1]]!=null)g+=`<line x1="${Xv(s.pts[o.cur])}" y1="${Yi(ci)}" x2="${Xv(s.pts[ms[ci+1]])}" y2="${Yi(ci+1)}" stroke="${s.color}" stroke-width="1.8" stroke-dasharray="4 3"/>`;
    const v=s.pts[ms[li]];if(v!=null)g+=`<circle cx="${Xv(v)}" cy="${Yi(li)}" r="4.5" fill="${Y}" stroke="#0f1419" stroke-width="1.5"/>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="small dim">* 진행 중인 달 · 오른쪽 숫자는 범례 색 순서</div>`;
}
document.addEventListener('mousemove',e=>{const svg=e.target.closest&&e.target.closest('.pcwrap svg');if(!svg)return;
  const r=REG[svg.dataset.id],b=svg.getBoundingClientRect(),{W,L,R}=PC,n=r.months.length;
  const i=Math.max(0,Math.min(n-1,Math.round(((e.clientX-b.left)/b.width*W-L)/(W-L-R)*(n-1)))),x=L+(n>1?i/(n-1):.5)*(W-L-R);
  const gl=svg.querySelector('.guide');gl.setAttribute('x1',x);gl.setAttribute('x2',x);gl.style.display='';
  const tip=svg.parentNode.querySelector('.tip'),m=r.months[i];
  tip.innerHTML=`<b>${m}</b><br>`+r.series.map(s=>`<span style="color:${s.color}">■</span> ${esc(s.name)}: ${fmt(s.pts[m])}`).join('<br>');
  tip.style.display='block';const px=x/W*b.width;tip.style.left=(px>b.width/2?px-tip.offsetWidth-12:px+12)+'px'});
document.addEventListener('mouseout',e=>{const svg=e.target.closest&&e.target.closest('.pcwrap svg');if(svg&&!svg.contains(e.relatedTarget)){svg.querySelector('.guide').style.display='none';svg.parentNode.querySelector('.tip').style.display='none'}});

/* ───── 지표 계산 ───── */
function ownSeries(d,idx){ // idx 0=글, 1=댓글 → 하루 평균
  return Object.entries(d.own).map(([sub,ms],i)=>({name:'r/'+sub,color:PAL[i%PAL.length],mode:'daily',raw:Object.fromEntries(Object.entries(ms).map(([m,v])=>[m,v[idx]])),
    pts:Object.fromEntries(Object.entries(ms).map(([m,v])=>[m,v[idx]/daysIn(m,d)]))}));
}
function sumSeries(name,list,months){const pts={};months.forEach(m=>{if(list.length&&list.every(s=>s.pts[m]!=null))pts[m]=list.reduce((a,s)=>a+s.pts[m],0)});return{name,color:Y,bold:true,pts}}
function mentionBySub(d){const l=Object.entries(d.mentions).map(([sub,ms],i)=>({name:'r/'+sub,color:PAL[i%PAL.length],pts:Object.fromEntries(Object.entries(ms).map(([m,by])=>[m,Object.values(by).reduce((a,b)=>a+b,0)]))}));
  return l.length>1?[sumSeries('합계',l,d.months),...l]:l}
function mentionByTerm(d){const subs=Object.values(d.mentions);const l=d.variants.map((t,i)=>{const pts={};d.months.forEach(m=>{if(subs.length&&subs.every(ms=>ms[m]))pts[m]=subs.reduce((a,ms)=>a+ms[m][t],0)});return{name:t,color:PAL[i%PAL.length],pts}});
  return l.length>1?[sumSeries('합계',l,d.months),...l]:l}
const GP={web:'구글',youtube:'유튜브'},GEO={US:'미국',WW:'전세계'};
function trendSeries(d){const out=[];let c=0;const groups={};
  d.trends.forEach(s=>(groups[s.gprop+'·'+s.geo]||(groups[s.gprop+'·'+s.geo]=[])).push(s));
  for(const [key,list] of Object.entries(groups)){const [gp,geo]=key.split('·'),tag=`${GP[gp]}·${GEO[geo]}`;
    const l=list.map(s=>({name:`${s.term} (${tag})`,color:PAL[c++%PAL.length],group:tag,pts:Object.fromEntries(Object.entries(s.points).map(([m,v])=>[m,v[0]]))}));
    if(l.length>1){const t=sumSeries(`합계 (${tag})`,l,d.months);t.color=out.length?PAL[c++%PAL.length]:Y;t.group=tag;t.isSum=true;out.push(t)}
    out.push(...l)}
  return out}

/* ───── 연간 요약표 (완료된 달만) ───── */
function yearAgg(s,d,year,upto){let a=0,b=0;d.months.forEach(m=>{if(m===d.cur_month||+m.slice(0,4)!==year||(upto&&+m.slice(5)>upto))return;
    if(s.mode==='daily'){if(s.raw[m]!=null){a+=s.raw[m];b+=daysIn(m,d)}}else if(s.pts[m]!=null){a+=s.pts[m];b++}});return b?a/b:null}
function yearTable(d){
  const done=d.months.filter(m=>m!==d.cur_month),last=done[done.length-1],LY=+last.slice(0,4),LM=+last.slice(5);
  const years=[];for(let y=2019;y<=LY;y++)years.push(y);
  const rows=[];
  ownSeries(d,1).forEach(s=>rows.push({label:`${s.name} 하루 평균 댓글 수`,short:'댓글/일',s}));
  ownSeries(d,0).forEach(s=>rows.push({label:`${s.name} 하루 평균 글 수`,short:'글/일',s}));
  mentionBySub(d).forEach(s=>rows.push({label:`언급 글 수 ${s.name} (월평균)`,short:'언급 '+s.name.replace('r/','').slice(0,6),s}));
  trendSeries(d).filter(s=>s.isSum||d.variants.length===1).forEach(s=>rows.push({label:`검색 관심도 ${s.name} (월평균 지수)`,short:s.group.replace('·',' '),s}));
  const pct=(a,b)=>a==null||b==null||b===0?'<td>–</td>':`<td class="${a>=b?'up':'down'}">${a>=b?'+':''}${((a/b-1)*100).toFixed(0)}%</td>`;
  const yy=y=>"'"+String(y).slice(2);
  return `<div class="card"><h3>연간 요약</h3><p class="desc">완료된 달만 사용. ${LY}년은 1~${LM}월. 증감률 둘째 열은 전년 같은 기간(1~${LM}월)과 비교.</p>
  <table><tr><th>지표</th>${years.map(y=>`<th><span class="h-pc">${y}${y===LY&&LM<12?` (1~${LM}월)`:''}</span><span class="h-mo">${yy(y)}</span></th>`).join('')}
  <th><span class="h-pc">${LY-1} vs ${LY-2}</span><span class="h-mo">${yy(LY-1)}/${yy(LY-2)}</span></th><th><span class="h-pc">${LY} vs ${LY-1} 동기간</span><span class="h-mo">${yy(LY)}/${yy(LY-1)}</span></th></tr>
  ${rows.map(r=>`<tr><td><span class="h-pc">${esc(r.label)}</span><span class="h-mo">${esc(r.short)}</span></td>${years.map(y=>`<td>${fmtS(yearAgg(r.s,d,y))||'–'}</td>`).join('')}${pct(yearAgg(r.s,d,LY-1),yearAgg(r.s,d,LY-2))}${pct(yearAgg(r.s,d,LY),yearAgg(r.s,d,LY-1,LM))}</tr>`).join('')}
  </table><div class="foot"><span>자체 계산, 공식 수치 아님. '–' = 데이터 없음(서브레딧 생성 전 또는 미수집).</span><span class="src">출처: arctic-shift, Google Trends</span></div></div>`;
}

/* ───── 탭별 화면 ───── */
const FOOT_R='자체 계산, 공식 수치 아님(월 합계 ÷ 날짜 수). 아카이브 집계라 실제와 조금 다를 수 있음.';
function viewOwn(d){
  if(!Object.keys(d.own).length)return '<div class="card dim">전용 서브레딧을 고르지 않았습니다.</div>';
  const o={months:d.months,cur:d.cur_month,source:'arctic-shift (레딧 아카이브)',foot:FOOT_R};
  return chart('own-c',{...o,title:'전용 서브레딧 · 하루 평균 댓글 수',desc:'단위: 개/일. 메인 지표. 서브레딧이 생기기 전 달은 표시하지 않음.',series:ownSeries(d,1)})
       + chart('own-p',{...o,title:'전용 서브레딧 · 하루 평균 글 수',desc:'단위: 개/일. 보조 지표(지워진 글·재업로드로 출렁일 수 있음).',series:ownSeries(d,0)});
}
function viewMention(d){
  const o={months:d.months,cur:d.cur_month,source:'arctic-shift 글 검색',foot:'자체 계산, 공식 수치 아님. 변형별로 따로 세어 더함(한 글에 두 변형이 있으면 중복).'};
  const cands=d.candidates.length?`<div class="box"><b>추천 서브레딧</b> <span class="dim small">(전용 서브레딧 활동 많은 사람들이 함께 활동하는 곳 · 숫자 = 겹친 사람 수)</span><div class="row" style="margin-top:6px">${d.candidates.map(c=>`<label class="ck"><input type="checkbox" class="candck" value="${esc(c.name)}">r/${esc(c.name)} <span class="dim">${c.score}</span></label>`).join('')}</div></div>`:'';
  return `<div class="card"><h3>언급을 볼 서브레딧</h3><div class="row" style="margin:8px 0">${d.subs.filter(s=>s.kind==='mention').map(s=>`<span class="ck" style="padding:5px 10px;border:1px solid var(--line)">r/${esc(s.name)} <a href="#" class="rmsub warn" data-s="${esc(s.name)}">✕</a></span>`).join('')||'<span class="dim">없음</span>'}</div>
   ${cands}<div class="row"><input type="text" id="addSubs" placeholder="직접 추가: transformers, ActionFigures" style="flex:1"><button id="btnAddSubs">추가하고 수집</button></div></div>`
   + mentionCharts(d,o);
}
function mentionCharts(d,o){
  o=o||{months:d.months,cur:d.cur_month,source:'arctic-shift 글 검색',foot:'자체 계산, 공식 수치 아님. 변형별로 따로 세어 더함(한 글에 두 변형이 있으면 중복).'};
  return (Object.keys(d.mentions).length?chart('men-s',{...o,title:'다른 서브레딧 언급 · 서브레딧별 월별 글 수',desc:'단위: 개/월(제목에 키워드가 든 글). 아직 수집 안 된 달은 비어 있음.',series:mentionBySub(d)})
   + (d.variants.length>1?chart('men-t',{...o,title:'다른 서브레딧 언급 · 변형별 월별 글 수',desc:'단위: 개/월. 고른 서브레딧 전체 합.',series:mentionByTerm(d)}):''):'');
}
function viewTrend(d){
  const series=trendSeries(d);
  return chart('trend',{months:d.months,cur:d.cur_month,title:'검색 관심도 · 구글 / 유튜브',desc:'단위: 지수 0~100(월별). <b class="warn">같은 괄호(같은 요청) 안의 선끼리만 높이 비교 가능</b>, 괄호가 다르면 각자 기준이 다름. 범례를 눌러 선을 켜고 끌 수 있음.',
    series,defaultHidden:series.filter(s=>s.group.includes('전세계')).map(s=>s.name),source:'Google Trends (pytrends, 비공식)',foot:'합계 선은 자체 계산, 공식 수치 아님.'});
}
function viewCompare(){
  const ds=[...S.cmp].map(id=>S.cmpData[id]).filter(Boolean);
  if(ds.length<2)return '<div class="card dim">위 "저장된 키워드"에서 비교할 키워드를 2개 이상 체크하세요.</div>';
  const base=ds[0],mk=(f)=>ds.map((d,i)=>{const l=f(d),s=l.length>1&&l[0].name==='합계'?l[0]:l.length>1?sumSeries('',l,d.months):l[0]||{pts:{}};return{name:d.keyword,color:PAL[i%PAL.length],pts:s.pts}});
  const o={months:base.months,cur:base.cur_month,foot:'자체 계산, 공식 수치 아님.'};
  return chart('cmp-c',{...o,title:'키워드 비교 · 전용 서브레딧 하루 평균 댓글 수',desc:'단위: 개/일. 전용 서브레딧이 여럿이면 합계.',source:'arctic-shift',series:mk(d=>ownSeries(d,1))})
   + chart('cmp-p',{...o,title:'키워드 비교 · 전용 서브레딧 하루 평균 글 수',desc:'단위: 개/일.',source:'arctic-shift',series:mk(d=>ownSeries(d,0))})
   + chart('cmp-m',{...o,title:'키워드 비교 · 다른 서브레딧 언급 글 수',desc:'단위: 개/월. 키워드마다 고른 서브레딧이 다르면 단순 비교에 주의.',source:'arctic-shift 글 검색',series:mk(d=>mentionBySub(d))})
   + '<div class="card dim small">검색 관심도는 키워드를 따로 요청해서 기준(0~100)이 서로 달라 비교 차트에서 뺐습니다.</div>';
}
const TABS=[['own','전용 서브레딧'],['mention','다른 서브레딧 언급'],['trend','검색 관심도'],['year','연간 요약표'],['cmp','키워드 비교']];
const VIEW={own:viewOwn,mention:viewMention,trend:viewTrend,year:yearTable,cmp:viewCompare};
function render(){
  const d=S.data;if(!d){$('#result').innerHTML='';return}
  $('#result').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(d.keyword)} <span class="dim small">변형: ${d.variants.map(esc).join(', ')} · 기준일 ${d.today} (UTC)</span></h2>
   <div class="row"><button id="btnCsv">CSV</button><button id="btnHtml">HTML 리포트</button><button id="btnRefresh">지금 갱신</button><button id="btnDel" class="warn">삭제</button></div></div>
   <div class="row" style="margin-top:10px">${TABS.map(([k,n])=>`<button class="tab ${S.tab===k?'on':''}" data-tab="${k}">${n}</button>`).join('')}</div>
   <div class="row" style="margin-top:8px">${[['all','전체(2019~)'],['3y','최근 3년'],['1y','최근 1년']].map(([k,n])=>`<button class="rng ${S.range===k?'on':''}" data-r="${k}">${n}</button>`).join('')}
   <button id="btnLabels" class="pc ${S.allLabels?'on':''}">모든 점 라벨</button></div></div>`+VIEW[S.tab](d);
}

/* ───── 진행 패널 ───── */
let lastDone=-1;
async function pollStatus(){
  if(S.kid){try{
    const s=await api('/api/status?kid='+S.kid),c=s.counts,done=c.done||0,total=Object.values(c).reduce((a,b)=>a+b,0),left=(c.queued||0)+(c.running||0);
    const p=$('#progress');p.style.display=total?'':'none';
    const cur=s.current?(s.current_kid===S.kid?s.current:'다른 키워드 수집 중 — '+s.current):left?'대기 중':'쉬는 중';
    p.innerHTML=`<h2>2. 수집 진행</h2><div><b style="color:var(--y)">${left||s.current?'▶':'■'}</b> ${esc(cur)} ${s.cooldown>0?`<span class="warn">· 서버 과부하 응답으로 ${s.cooldown}초 쉬는 중</span>`:''}</div>
     <div class="bar"><i style="width:${total?done/total*100:0}%"></i></div>
     <div class="small dim">전체 ${total}개 중 완료 ${done} · 남음 ${left} · 보류 ${c.hold||0} · 실패 ${c.failed||0}</div>
     ${s.holds.length?`<div class="box small"><b class="warn">보류·실패한 구간</b> <span class="dim">(다른 구간 먼저 진행, 나중에 자동 재시도)</span>${s.holds.map(h=>`<div>${h.sub?'r/'+esc(h.sub):'구글 트렌드'} ${h.term?`'${esc(h.term)}'`:''} ${h.first?`${h.first.slice(0,7)} ~ ${h.last.slice(0,7)}`:''} · ${h.n}개 · <span class="dim">${esc(h.msg||'')}</span>${h.next_at>s.now?` · ${Math.ceil((h.next_at-s.now)/60)}분 뒤 재시도`:''}</div>`).join('')}</div>`:''}`;
    if(done!==lastDone){lastDone=done;await loadData(false)}
  }catch(e){}}
  setTimeout(pollStatus,3000);
}
async function loadData(force=true){
  if(!S.kid)return;S.data=await api('/api/keywords/'+S.kid+'/data');S.cmpData[S.kid]=S.data;
  const a=document.activeElement;if(force||!(a&&a.id==='addSubs')&&!document.querySelector('.candck:checked'))render();
}
async function loadSaved(){
  const ks=await api('/api/keywords');
  $('#saved').innerHTML=ks.length?ks.map(k=>`<button class="kwbtn ${k.id===S.kid?'on':''}" data-id="${k.id}">${esc(k.name)}</button>`).join(''):'<span class="dim">아직 없음</span>';
  $('#cmpRow').innerHTML=ks.length>1?'비교: '+ks.map(k=>`<label class="ck"><input type="checkbox" class="cmpck" value="${k.id}" ${S.cmp.has(k.id)?'checked':''}>${esc(k.name)}</label>`).join(''):'';
  if(!S.kid&&ks.length)select(ks[ks.length-1].id);
}
async function select(id){S.kid=id;lastDone=-1;S.data=null;await loadData();loadSaved()}

/* ───── 1단계: 후보 확인 ───── */
$('#btnSuggest').onclick=async()=>{
  const kw=$('#kw').value.trim();if(!kw)return;$('#cand').innerHTML='<p class="dim">찾는 중…</p>';
  try{const r=await api('/api/suggest',{body:{keyword:kw}});
    $('#cand').innerHTML=`<div class="box"><b>변형</b> <span class="dim small">체크한 것만 수집. 레딧 검색은 단어 단위라 단수·복수를 따로 찾습니다. 구글 트렌드는 최대 5개.</span>
      <div class="row" style="margin:6px 0">${r.variants.map(v=>`<label class="ck"><input type="checkbox" class="vck" value="${esc(v)}" checked>${esc(v)}</label>`).join('')}</div>
      <input type="text" id="vAdd" placeholder="변형 직접 추가(쉼표로 구분): 공식 영문명, 약칭 등" style="width:100%"></div>
     <div class="box"><b>전용 서브레딧</b> ${r.error?`<span class="warn small">${esc(r.error)} — 아래에 직접 입력하거나 다시 시도</span>`:''}
      <div class="row" style="margin:6px 0">${r.subs.map(s=>`<label class="ck"><input type="checkbox" class="ock" value="${esc(s.name)}" ${s.exact?'checked':''}>r/${esc(s.name)} <span class="dim">구독 ${s.subscribers.toLocaleString()}${s.created_utc?' · '+new Date(s.created_utc*1000).toISOString().slice(0,7)+' 생성':''}</span></label>`).join('')||'<span class="dim">이름이 비슷한 서브레딧을 못 찾음</span>'}</div>
      <input type="text" id="oAdd" placeholder="전용 서브레딧 직접 추가(쉼표로 구분)" style="width:100%"></div>
     <div class="box"><b>언급을 볼 다른 서브레딧</b> <span class="dim small">지금 비워 두고, 수집 시작 뒤 나오는 추천에서 골라도 됩니다.</span>
      <input type="text" id="mAdd" placeholder="예: transformers, ActionFigures" style="width:100%;margin-top:6px"></div>
     <button class="main" id="btnStart">수집 시작</button>`;
  }catch(e){$('#cand').innerHTML=`<p class="warn">${esc(e.message)}</p>`}
};
$('#kw').onkeydown=e=>{if(e.key==='Enter')$('#btnSuggest').click()};
const split=s=>(s||'').split(',').map(x=>x.trim()).filter(Boolean);
const vals=sel=>[...document.querySelectorAll(sel+':checked')].map(x=>x.value);

document.addEventListener('click',async e=>{
  const t=e.target;
  if(t.id==='btnStart'){const r=await api('/api/keywords',{body:{name:$('#kw').value,variants:[...vals('.vck'),...split($('#vAdd').value)],own_subs:[...vals('.ock'),...split($('#oAdd').value)],mention_subs:split($('#mAdd').value)}});$('#cand').innerHTML='';$('#kw').value='';S.tab='own';select(r.id)}
  else if(t.classList.contains('kwbtn'))select(+t.dataset.id);
  else if(t.classList.contains('tab')){S.tab=t.dataset.tab;render()}
  else if(t.classList.contains('rng')){S.range=t.dataset.r;render()}
  else if(t.id==='btnLabels'){S.allLabels=!S.allLabels;render()}
  else if(t.closest('.lg')){const b=t.closest('.lg'),h=S.hidden[b.dataset.chart];h.has(b.dataset.s)?h.delete(b.dataset.s):h.add(b.dataset.s);render()}
  else if(t.id==='btnAddSubs'){const subs=[...vals('.candck'),...split($('#addSubs').value)];if(subs.length){await api(`/api/keywords/${S.kid}/mention_subs`,{body:{subs}});loadData()}}
  else if(t.classList.contains('rmsub')){e.preventDefault();if(confirm(`r/${t.dataset.s} 을(를) 빼고 남은 수집을 취소할까요?`)){await api(`/api/keywords/${S.kid}/subs/${encodeURIComponent(t.dataset.s)}`,{method:'DELETE'});loadData()}}
  else if(t.id==='btnCsv')location.href=`/api/keywords/${S.kid}/export.csv`;
  else if(t.id==='btnRefresh'){await api(`/api/keywords/${S.kid}/refresh`,{});lastDone=-1}
  else if(t.id==='btnDel'){if(confirm(`'${S.data.keyword}' 키워드와 수집 대기열을 삭제할까요?`)){await api('/api/keywords/'+S.kid,{method:'DELETE'});S.cmp.delete(S.kid);S.kid=null;S.data=null;$('#progress').style.display='none';render();loadSaved()}}
  else if(t.id==='btnHtml')exportHtml();
});
document.addEventListener('change',async e=>{if(e.target.classList.contains('cmpck')){const id=+e.target.value;e.target.checked?S.cmp.add(id):S.cmp.delete(id);
  for(const i of S.cmp)if(!S.cmpData[i])S.cmpData[i]=await api('/api/keywords/'+i+'/data');if(S.cmp.size>=2)S.tab='cmp';render()}});

/* ───── 내보내기: 차트 포함 단일 HTML ───── */
function exportHtml(){
  const d=S.data,keep=S.tab;let body='';
  ['own','mention','trend','year'].forEach(k=>{S.tab=k;body+=k==='mention'?mentionCharts(d):VIEW[k](d)});S.tab=keep;render();
  const html=`<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(d.keyword)} 리포트</title>
<link href="https://fonts.googleapis.com/css2?family=42dot+Sans:wght@400;500;700&display=swap" rel="stylesheet"><style>${$('#css').textContent} .lg{pointer-events:none}</style></head><body><main>
<h1>${esc(d.keyword)} <span class="dim small">레딧 + 검색 관심도 · 기준일 ${d.today} · 변형: ${d.variants.map(esc).join(', ')}</span></h1>${body}
<p class="dim small">개인 리서치용. arctic-shift·Google Trends 비공식 데이터 기반이며 자체 계산값은 공식 수치가 아닙니다.</p></main></body></html>`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=`${d.keyword}-report-${d.today}.html`;a.click();
}
loadSaved();pollStatus();
</script>
</body>
</html>
